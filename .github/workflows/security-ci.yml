name: Phase 6 Security CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase6-security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-static-validation:
    name: terraform-static-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize providers without backend
        run: terraform init -backend=false
      - name: Validate Terraform configuration
        run: terraform validate
      - name: Controlled negative path - Terraform formatting rejection
        run: |
          set -euo pipefail
          set +x
          inconclusive() {
            printf '%s\n' 'CF-01: INCONCLUSIVE'
            exit 3
          }
          temporary_copy="$(mktemp -d "${RUNNER_TEMP}/phase6-controlled-failure.XXXXXX" 2>/dev/null)" || inconclusive
          cleanup() {
            if ! rm -rf -- "$temporary_copy" >/dev/null 2>&1 || [[ -e "$temporary_copy" ]]; then
              printf '%s\n' 'CF-01: INCONCLUSIVE'
              exit 4
            fi
          }
          trap cleanup EXIT
          case "$temporary_copy/" in
            "$GITHUB_WORKSPACE/"*) inconclusive ;;
          esac
          shopt -s nullglob
          configuration_files=( ./*.tf )
          [[ ${#configuration_files[@]} -gt 0 ]] || inconclusive
          cp -- "${configuration_files[@]}" "$temporary_copy/" >/dev/null 2>&1 || inconclusive
          printf 'locals {\n  controlled_failure_probe="expected"\n}\n' >"$temporary_copy/controlled_failure.tf" || inconclusive
          cd "$temporary_copy" || inconclusive
          initial_status=0
          terraform fmt -check -recursive >/dev/null 2>&1 || initial_status=$?
          if [[ $initial_status -eq 0 ]]; then
            printf '%s\n' 'CF-01: UNEXPECTED PASS'
            exit 2
          fi
          [[ $initial_status -eq 3 ]] || inconclusive
          terraform fmt -recursive >/dev/null 2>&1 || inconclusive
          terraform fmt -check -recursive >/dev/null 2>&1 || inconclusive
          cd "$RUNNER_TEMP" || inconclusive
          cleanup
          trap - EXIT
          printf '%s\n' 'CF-01: EXPECTED FORMATTING REJECTION VERIFIED'
          exit 1

  iac-security-scan:
    name: iac-security-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: config
          scan-ref: terraform/
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/iac-security-scan.json
          trivyignores: .trivyignore.yaml
          cache-dir: ${{ runner.temp }}/trivy-cache
          cache: 'false'
          hide-progress: 'true'
          timeout: 10m
      - name: Validate report and emit safe finding metadata
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/iac-security-scan.json
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          report = Path(os.environ["REPORT_PATH"])
          try:
              data = json.loads(report.read_text())
              if data.get("SchemaVersion") != 2:
                  raise ValueError("invalid report schema")

              results = data.get("Results")
              if results is None:
                  results = []
              if not isinstance(results, list) or not all(isinstance(r, dict) for r in results):
                  raise ValueError("invalid results")

              findings = [
                  finding
                  for result in results
                  for finding in (result.get("Misconfigurations") or [])
                  if isinstance(finding, dict)
              ]

              print("Finding count:", len(findings))
              for finding in findings:
                  rule = finding.get("ID", "")
                  severity = finding.get("Severity", "")
                  safe_rule = rule if re.fullmatch(r"[A-Za-z0-9_-]{1,100}", rule) else "REDACTED"
                  safe_severity = severity if severity in {"UNKNOWN","LOW","MEDIUM","HIGH","CRITICAL"} else "UNKNOWN"
                  print(safe_rule, safe_severity)

              if findings:
                  raise SystemExit(1)
          except (OSError, ValueError, TypeError, KeyError, json.JSONDecodeError):
              print("Scanner report unavailable or invalid; gate failed.")
              raise SystemExit(1)
          finally:
              report.unlink(missing_ok=True)
          PY

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan repository content for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: ${{ runner.temp }}/secret-scan.json
          cache-dir: ${{ runner.temp }}/trivy-cache
          cache: 'false'
          hide-progress: 'true'
          timeout: 10m
      - name: Validate report and emit safe finding metadata
        if: ${{ always() && !cancelled() }}
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/secret-scan.json
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          report = Path(os.environ["REPORT_PATH"])
          try:
              data = json.loads(report.read_text())
              if data.get("SchemaVersion") != 2:
                  raise ValueError("invalid report schema")

              results = data.get("Results")
              if results is None:
                  results = []
              if not isinstance(results, list) or not all(isinstance(r, dict) for r in results):
                  raise ValueError("invalid results")

              findings = [
                  finding
                  for result in results
                  for finding in (result.get("Secrets") or [])
                  if isinstance(finding, dict)
              ]

              print("Finding count:", len(findings))
              for finding in findings:
                  rule = finding.get("RuleID", "")
                  severity = finding.get("Severity", "")
                  safe_rule = rule if re.fullmatch(r"[A-Za-z0-9_-]{1,100}", rule) else "REDACTED"
                  safe_severity = severity if severity in {"UNKNOWN","LOW","MEDIUM","HIGH","CRITICAL"} else "UNKNOWN"
                  print(safe_rule, safe_severity)

              if findings:
                  raise SystemExit(1)
          except (OSError, ValueError, TypeError, KeyError, json.JSONDecodeError):
              print("Scanner report unavailable or invalid; gate failed.")
              raise SystemExit(1)
          finally:
              report.unlink(missing_ok=True)
          PY
