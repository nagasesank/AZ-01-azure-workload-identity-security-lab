    <g transform="translate(470,0)"><rect x="0" y="210" width="160" height="112" rx="16" fill="#18242e" stroke="#e49b55" stroke-width="2"/><circle cx="80" cy="242" r="13" fill="#e49b55" filter="url(#glow)"/><text x="80" y="274" fill="#ffffff" font-size="16" font-weight="700">CONTROLLED</text><text x="80" y="294" fill="#ffffff" font-size="16" font-weight="700">ATTACK</text><text x="80" y="314" fill="#a9bbc6" font-size="12">Bounded validation</text></g><text x="654" y="262" fill="#74c9ea" font-size="27" font-weight="700">→</text>
    <g transform="translate(670,0)"><rect x="0" y="210" width="180" height="112" rx="16" fill="#18242e" stroke="#42aee0" stroke-width="2"/><circle cx="90" cy="242" r="13" fill="#42aee0" filter="url(#glow)"/><text x="90" y="274" fill="#ffffff" font-size="15" font-weight="700">SECRETLESS</text><text x="90" y="294" fill="#ffffff" font-size="15" font-weight="700">REMEDIATION</text><text x="90" y="314" fill="#a9bbc6" font-size="12">GitHub OIDC + Entra</text></g><text x="874" y="262" fill="#74c9ea" font-size="27" font-weight="700">→</text>
    <g transform="translate(890,0)"><rect x="0" y="210" width="160" height="112" rx="16" fill="#18242e" stroke="#62c781" stroke-width="2"/><circle cx="80" cy="242" r="13" fill="#62c781" filter="url(#glow)"/><text x="80" y="280" fill="#ffffff" font-size="17" font-weight="700">LEAST PRIVILEGE</text><text x="80" y="304" fill="#a9bbc6" font-size="13">Scoped Azure RBAC</text></g><text x="1074" y="262" fill="#74c9ea" font-size="27" font-weight="700">→</text>
    <g transform="translate(1090,0)"><rect x="0" y="210" width="160" height="112" rx="16" fill="#18242e" stroke="#74c9ea" stroke-width="2"/><circle cx="80" cy="242" r="13" fill="#74c9ea" filter="url(#glow)"/><text x="80" y="280" fill="#ffffff" font-size="17" font-weight="700">REVALIDATION</text><text x="80" y="304" fill="#a9bbc6" font-size="13">Allow + explicit deny</text></g><text x="1274" y="262" fill="#74c9ea" font-size="27" font-weight="700">→</text>
