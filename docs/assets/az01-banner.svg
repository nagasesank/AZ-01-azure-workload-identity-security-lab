<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">AZ-01 Azure Workload Identity Attack and Secretless Federation Lab</title>
  <desc id="desc">Credential risk, controlled attack validation, GitHub OIDC remediation, least privilege, revalidation, teardown, and CI/CD hardening.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1118"/><stop offset="0.55" stop-color="#111c26"/><stop offset="1" stop-color="#0b1118"/></linearGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1600" height="420" rx="24" fill="url(#bg)"/><rect x="16" y="16" width="1568" height="388" rx="20" fill="none" stroke="#2d8eb8" stroke-width="2" opacity="0.85"/><rect x="25" y="25" width="1550" height="370" rx="16" fill="none" stroke="#163b4d" stroke-width="1"/>
  <text x="54" y="102" fill="#f4f8fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="78" font-weight="800">AZ-01</text><text x="58" y="146" fill="#cfe3ec" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600">Azure Workload Identity Attack &amp; Secretless Federation Lab</text><text x="58" y="178" fill="#86a2b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Controlled identity compromise → secretless federation → bounded authorization validation</text>
